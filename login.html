<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(to left, lightgoldenrodyellow, #936959);
        }

        .login-container {
            max-width: 900px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .login-img {
            width: 100%;
            object-fit: cover;
            height: 100%;
        }

        .login-left {
            background-color: #f1f3f5;
        }

        .form-floating label {
            padding-left: 0.75rem;
        }

        .form_sec h2{
            color: #634c43;
        }
        .btn-primary {
            background-color: #936959;
            border: none;
        }

        .btn-primary:hover {
            background-color: #634c43;
        }
        
        .btn-primary:focus{
            background-color: #634c43 !important;
        }

        .link a{
            color: #936959;
        }
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
        }
    </style>
</head>

<body class="bg-light">
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row login-container w-100">
        
            <div class="col-md-6 login-left p-0">
                <img src="images/login.PNG" alt="Login Illustration" class="login-img h-100 w-100">
            </div>

          
            <div class="col-md-6 p-5 form_sec d-flex flex-column justify-content-center">
                <h2 class="text-center mb-4">Login</h2>
                <form id="loginForm" class="needs-validation" novalidate>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" name="email"
                            required>
                        <label for="email">Email address</label>
                        <div class="invalid-feedback">
                            Please enter a valid email address.
                        </div>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Password" name="password"
                            required>
                        <label for="password">Password</label>
                        <div class="invalid-feedback">
                            Please enter your password.
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>

                    <div class="text-center mt-4 link">
                        Don't have an account? <a href="/Ecommerce-Project/signup.html">Sign up here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <script>
        // Bootstrap validation
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
        //login validation
        const form = document.querySelector('#loginForm');
        form.addEventListener('submit', (e) => {
                  if (!form.checkValidity()) return; 
            e.preventDefault()
            let email = document.getElementById('email').value
            let password = document.getElementById('password').value
            const users = JSON.parse(localStorage.getItem('users'));

            let accountExists = false;
            let matchedUser = null;
            for (let i = 0; i < users.length; i++) {
                if (users[i].email === email && users[i].password === password) {
                    accountExists = true;
                    matchedUser = users[i];
                    break;
                }
            }
            if (accountExists) {
                let currentUser = {
                    email: matchedUser.email,
                    password: matchedUser.password,
                    username: matchedUser.username,
                    isSeller: matchedUser.isSeller,
                    isAdmin: matchedUser.isAdmin
                };
                alert('successed')
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                if (currentUser.isSeller) {
                    window.location.href = '../sellerProfile.html'

                } else if (currentUser.isAdmin) {
                    window.location.href = '../Admin.html'

                } else {
                    window.location.href = '../home.html'

                }
            } else {
                alert('invalid pass or email')
            }
        })



    </script>


</body>

</html>
