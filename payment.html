<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <title>Payment methods</title>
    <style>
        .accordion {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <div class="row g-4">

            <div class="col-md-6">
                <h2 class="mb-3">Payment Methods</h2>
                <div class="accordion" id="paymentAccordion">
                    <div class="accordion-item border-0 rounded mb-3 shadow-sm">
                        <h2 class="accordion-header" id="headingCredit">
                            <button class="accordion-button d-flex align-items-center gap-2 collapsed" type="button"
                                data-bs-toggle="collapse" data-bs-target="#collapseCredit" aria-expanded="false"
                                aria-controls="collapseCredit">
                                <input class="form-check-input mt-0" type="radio" name="payment_method" id="credit">
                                <label class="form-check-label ms-2 mb-0 fw-bold" for="credit">Credit Card</label>
                            </button>
                        </h2>
                        <div id="collapseCredit" class="accordion-collapse collapse" aria-labelledby="headingCredit"
                            data-bs-parent="#paymentAccordion">
                            <div class="accordion-body bg-light rounded-bottom">
                                <form class="p-3 bg-white rounded shadow-sm">
                                    <div class="mb-3">
                                        <label for="cardName" class="form-label">Cardholder Name</label>
                                        <input type="text" class="form-control" id="cardName" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="cardNumber" class="form-label">Card Number</label>
                                        <input type="text" class="form-control" id="cardNumber"
                                            placeholder="1234 5678 9012 3456" maxlength="19" required>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="cardExpiry" class="form-label">Expiry Date</label>
                                            <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY"
                                                maxlength="5" required>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="cardCVC" class="form-label">CVC</label>
                                            <input type="text" class="form-control" id="cardCVC" maxlength="4" required>
                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                    <div class="accordion-item border-0 rounded mb-3 shadow-sm">
                        <h2 class="accordion-header" id="headingCash">
                            <button class="accordion-button d-flex align-items-center gap-2 collapsed" type="button"
                                data-bs-toggle="collapse" data-bs-target="#collapseCash" aria-expanded="false"
                                aria-controls="collapseCash">
                                <input class="form-check-input mt-0" type="radio" name="payment_method" id="cash">
                                <label class="form-check-label ms-2 mb-0 fw-bold" for="cash">Cash</label>
                            </button>
                        </h2>
                        <div id="collapseCash" class="accordion-collapse collapse" aria-labelledby="headingCash"
                            data-bs-parent="#paymentAccordion">
                            <div class="accordion-body bg-light rounded-bottom">
                                <p class="mb-0">You will pay in cash upon delivery.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h2 class="mb-4">Your Order</h2>
                    <div class="order_details mb-3">
                        <div class="d-flex justify-content-between text-muted small border-bottom pb-2 mb-2">
                            <span class="fw-semibold">Product</span>
                            <span class="fw-semibold">Qty</span>
                            <span class="fw-semibold">Price</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <div class="product_name"></div>
                            <div class="product_amount text-end"></div>
                            <div class="product_price text-end"></div>
                        </div>
                    </div>

                    <hr />
                    <h5 class="mb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Sub Total:</span>
                        <span id="subtotal"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping:</span>
                        <span id="shipping_price"></span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-3">
                        <span>Grand Total:</span>
                        <span id="total"></span>
                    </div>
                    <div class="d-grid mt-4">
                        <button class="btn btn-primary btn-lg " id="confirm" type="submit">Confirm your order</button>
                    </div>
                </div>
            </div>

            <!-- Modal to take review-->
            <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="reviewModalLabel">Your order confimed please leave a Review</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="reviewForm">
                                <div class="mb-3">
                                    <label for="rating" class="form-label">Rating (1 to 5)</label>
                                    <input type="number" class="form-control" id="rating" min="1" max="5" required>
                                </div>
                                <div class="mb-3">
                                    <label for="reviewText" class="form-label">Review</label>
                                    <textarea class="form-control" id="reviewText" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit Review</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script>

        //get order confirmed in  cart from  locastorage key 'orders' values productName , quantity , price 
        let orders = JSON.parse(localStorage.getItem("orders"));
        let productName = document.querySelector(".product_name");
        let productAmount = document.querySelector(".product_amount");
        let productPrice = document.querySelector(".product_price");
        let subtotal = document.querySelector('#subtotal')
        let shippingPrice = document.querySelector('#shipping_price')
        let total = document.querySelector('#total')

        productName.innerHTML = "";
        productAmount.innerHTML = "";
        productPrice.innerHTML = "";
        let sum = 0;
        orders.forEach(order => {
            productName.innerHTML += `<p>${order.productName}</p>`;
            productAmount.innerHTML += `<p>${order.quantity}</p>`;
            productPrice.innerHTML += `<p>Price ${order.price}</p>`;
            sum += parseInt(order.price) * parseInt(order.quantity);
        });
        let shipping = 50;
        subtotal.innerHTML += sum;
        shippingPrice.innerHTML += shipping;
        total.innerHTML += sum + shipping;

        //confirm button 
        document.getElementById('confirm').addEventListener('click', () => {

            // start##############check if user choose payment method or not and write the method############
            let paymentMethod = document.querySelector('input[name="payment_method"]:checked');

            if (!paymentMethod) {
                alert("Please choose a payment method.");
                return;
            }


            let paymentData = {};
            if (paymentMethod.id === 'credit') {

                let cardName = document.getElementById('cardName').value;
                let cardNumber = document.getElementById('cardNumber').value;
                let cardExpiry = document.getElementById('cardExpiry').value;
                let cardCVC = document.getElementById('cardCVC').value;


                if (!cardName || !cardNumber || !cardExpiry || !cardCVC) {
                    alert("Please fill in all credit card details.");
                    return;
                }

                paymentData = {
                    method: "Credit Card",
                    cardName,
                    cardNumber,
                    cardExpiry,
                    cardCVC
                };
            } else if (paymentMethod.id === 'cash') {
                paymentData = { method: "Cash" };
            }

            // end##############check if user choose payment method or not and write the method############


            //start ##################saving customer order and his name in localstorage in key "confirmed orders"#############
            let customer = JSON.parse(localStorage.getItem("currentUser")).username;
            console.log(productName.innerText + customer)
            let order = orders.map(item => ({
                productName: item.productName,
                quantity: item.quantity,
                price: item.price,
                color: item.color,
                sellerName: item.sellerName
            }));

            localStorage.setItem('confirmed orders', JSON.stringify({ order, customer, paymentData }));
            //end ##################saving customer order and his name in localstorage in key "confirmed orders"#############

            //start##############################rate and review  in modal ##############################
            alert('your order is ready')
            const reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
            reviewModal.show();
            //end##############################rate and review  in modal ##############################

        })

        //start################### customer review logic###################
        document.getElementById('reviewForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const rating = document.getElementById('rating').value;
            const reviewText = document.getElementById('reviewText').value;
            const customer = JSON.parse(localStorage.getItem("currentUser")).username;


            const reviewData = { customer, rating, reviewText };
            localStorage.setItem('customerReview', JSON.stringify(reviewData));

            alert("Thank you for your review!");


            const reviewModal = bootstrap.Modal.getInstance(document.getElementById('reviewModal'));
            reviewModal.hide();
        })
        //end################### customer review logic###################
    </script>
</body>

</html>
