<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        body {
           background: linear-gradient(to right, lightgoldenrodyellow, #936959);
        }

        .signup-container {
            max-width: 900px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .signup-img {
            width: 80%;
            height: 80%;
        }

        .signup-left {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }

        .form-check-label {
            font-size: 0.95rem;
        }
        .btn-primary{
            background-color: #936959;
            border-color: #936959;
        }
        .btn-primary:hover{
            background-color:#634c43;
            border-color: #634c43;
        }
        .btn-primary:focus{
            background-color:#634c43 !important;
            border-color: #634c43 !important;
        }
        @media (max-width: 768px) {
            .signup-left {
                display: none;
            }
        }
    </style>
</head>

<body class="bg-light">
   
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row signup-container w-100">

            <div class="col-md-6 signup-left p-0">
                <img src="images/signup.png" alt="Sign Up Illustration" class="signup-img"  />
            </div>

      
            <div class="col-md-6 p-5">
                <h2 class="text-center mb-4">Create Account</h2>

                <form class="needs-validation" id="signupForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">User Name</label>
                        <input type="text" class="form-control" id="username" name="username" required />
                        <div class="invalid-feedback">Please enter a username.</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required />
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required />
                        <div class="invalid-feedback">Please enter a password.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            required />
                        <div class="invalid-feedback" id="confirmPasswordError">
                            Please confirm your password.
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isSeller" name="isSeller" />
                        <label class="form-check-label" for="isSeller">Sign up as a Seller?</label>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <script>
        // Bootstrap validation
        (() => {
            'use strict'
            const form = document.getElementById('signupForm')

            form.addEventListener('submit', event => {
                const password = document.getElementById('password').value
                const confirmPassword = document.getElementById('confirmPassword').value

                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                if (password !== confirmPassword) {
                    event.preventDefault()
                    event.stopPropagation()
                    const confirmPasswordField = document.getElementById('confirmPassword')
                    const confirmPasswordError = document.getElementById('confirmPasswordError')

                    confirmPasswordField.classList.add('is-invalid')
                    confirmPasswordError.textContent = "Passwords do not match."
                }

                form.classList.add('was-validated')
            }, false)
        })()
        const form = document.getElementById('signupForm');

        form.addEventListener('submit', (e) => {

               if (!form.checkValidity()) return; 
            if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) return;

            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const isSeller = document.getElementById('isSeller').checked;

            let users = JSON.parse(localStorage.getItem('users') || '[]');

            const emailExists = users.some(user => user.email.toLowerCase() === email);

            if (emailExists) {
                alert('This email has already been registered. Redirecting to login...');
                window.location.href = "login.html";
                return;
            }

            const newUser = { username, email, password, isSeller, isAdmin: false };
            users.push(newUser);

            const admin = {
                username: "amiraabdelhameed",
                password: "6",
                email: "admin@admin.com",
                isSeller: false,
                isAdmin: true
            };

            const adminExists = users.some(user =>
                user.email.toLowerCase() === admin.email.toLowerCase()
            );

            if (!adminExists) {
                users.push(admin);
            }

            localStorage.setItem('users', JSON.stringify(users));

            alert('Account created successfully! Redirecting to login...');
            window.location.href = "login.html";
        });

        // localStorage.clear()
    </script>

</body>

</html>
