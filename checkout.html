<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <title>Checkout</title>
</head>

<body>
    <div class="container my-5">
        <div class="row g-4">
            <!-- Shipping Form -->
            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h2 class="mb-4">Shipping Address</h2>
                    <form class="row g-3 needs-validation" id="checkoutForm" novalidate>
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" required />
                            <div class="invalid-feedback">Please enter your first name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" required />
                            <div class="invalid-feedback">Please enter your last name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone1" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone1" required />
                            <div class="invalid-feedback">Please enter your phone number.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone2" class="form-label">Second Phone Number</label>
                            <input type="text" class="form-control" id="phone2" required />
                            <div class="invalid-feedback">Please enter a second phone number.</div>
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" required />
                            <div class="invalid-feedback">Please provide an address.</div>
                        </div>
                        <div class="col-12 text-end">
                            <button class="btn btn-success mt-3 col-12" type="submit">Save Address</button>
                        </div>
                    </form>
                </div>
            </div>
    
            <!-- Payment Summary -->
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h2 class="mb-4">Your Order</h2>
                    <div class="order_details mb-3">
                        <div class="d-flex justify-content-between text-muted small border-bottom pb-2 mb-2">
                            <span class="fw-semibold">Product</span>
                            <span class="fw-semibold">Qty</span>
                            <span class="fw-semibold">Price</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <div class="product_name"></div>
                            <div class="product_amount text-end"></div>
                            <div class="product_price text-end"></div>
                        </div>
                    </div>
    
                    <hr />
                    <h5 class="mb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Sub Total:</span>
                        <span id="subtotal"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping:</span>
                        <span id="shipping_price"></span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-3">
                        <span>Grand Total:</span>
                        <span id="total"></span>
                    </div>
                    <div class="d-grid mt-4">
                        <button class="btn btn-primary btn-lg" id="checkout">Continue to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
  <script src="checkout.js"></script>
</body>

</html>
